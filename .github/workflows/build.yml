name: build
on:
  push:
    branches: [ master ]
jobs:
  chobits:
    name: Build chobits
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Checkout deps
        run: |
          mkdir deps
          cd    deps
          sudo  apt -y update
          sudo  apt -y install gcc g++ wget cmake unzip ffmpeg libsdl2-dev libavutil-dev libavcodec-dev libswscale-dev libavdevice-dev libavformat-dev libswresample-dev
          wget  https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.8.0%2Bcpu.zip > /dev/null 2>&1
          unzip libtorch-shared-with-deps-2.8.0+cpu.zip > /dev/null 2>&1
      - name: Deploy chobits
        run: |
          mkdir build
          cd    build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make
          sudo make install
          